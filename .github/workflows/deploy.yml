name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout plurafy site repo
        uses: actions/checkout@v4
        with:
          repository: plurafy/plurafy
          token: ${{ secrets.DEPLOY_PAT }}
          path: site

      - name: Copy build to /master-react
        run: |
          mkdir -p site/master-react
          rsync -a --delete build/client/ site/master-react/

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master-react
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy master-react from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push
          fi
